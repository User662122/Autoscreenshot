<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
        <title>Screen Stream</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html, body {
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #000;
            }
            video {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                object-fit: contain;
                background: #000;
            }
        </style>
    </head>
    <body>
        <video id="remoteVideo" autoplay playsinline muted></video>

        <script>
            var video = document.getElementById("remoteVideo");
            var config = {
                iceServers: [
                    { urls: "stun:stun.l.google.com:19302" },
                    { urls: "stun:stun1.l.google.com:19302" },
                ],
            };

            var ws = null;
            var pc = null;
            var pendingIceCandidates = [];
            var reconnectAttempts = 0;
            var MAX_RECONNECT_ATTEMPTS = 10;

            video.onclick = function () {
                if (video.paused && video.srcObject) {
                    video.play().catch(function (e) {
                        console.log("Play failed: " + e.message);
                    });
                }
            };

            function tryPlayVideo() {
                if (!video.srcObject) return;
                video.play().catch(function (error) {
                    console.log("Autoplay blocked: " + error.message);
                });
            }

            function connectWebSocket() {
                var host = window.location.hostname;
                var protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
                var port = window.location.port || (window.location.protocol === "https:" ? "443" : "80");
                var wsUrl = protocol + "//" + host + ":" + port;

                try {
                    ws = new WebSocket(wsUrl);

                    ws.onopen = function () {
                        console.log("WebSocket connected");
                        reconnectAttempts = 0;
                        pendingIceCandidates = [];
                        ws.send(JSON.stringify({ type: "client-connected" }));
                    };

                    ws.onmessage = function (event) {
                        try {
                            var data = JSON.parse(event.data);
                            handleMessage(data);
                        } catch (error) {
                            console.log("Parse error: " + error.message);
                        }
                    };

                    ws.onerror = function (error) {
                        console.log("WebSocket error");
                    };

                    ws.onclose = function (event) {
                        console.log("WebSocket closed: " + event.code);
                        if (!event.wasClean && reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
                            reconnectAttempts++;
                            setTimeout(connectWebSocket, 2000);
                            return;
                        }
                        cleanup();
                    };
                } catch (error) {
                    console.log("Connection failed: " + error.message);
                }
            }

            function handleMessage(data) {
                switch (data.type) {
                    case "offer":
                        handleOffer(data);
                        break;
                    case "ice-candidate":
                        handleIceCandidate(data);
                        break;
                }
            }

            function handleOffer(data) {
                pc = new RTCPeerConnection(config);

                pc.onicecandidate = function (event) {
                    if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({
                            type: "ice-candidate",
                            sdpMid: event.candidate.sdpMid,
                            sdpMLineIndex: event.candidate.sdpMLineIndex,
                            candidate: event.candidate.candidate,
                        }));
                    }
                };

                pc.ontrack = function (event) {
                    if (event.streams && event.streams[0]) {
                        video.srcObject = event.streams[0];
                    } else if (event.track) {
                        var stream = new MediaStream();
                        stream.addTrack(event.track);
                        video.srcObject = stream;
                    }
                    setTimeout(tryPlayVideo, 100);

                    if (event.track.kind === "video") {
                        event.track.onunmute = function () {
                            tryPlayVideo();
                        };
                    }
                };

                pc.onconnectionstatechange = function () {
                    if (pc.connectionState === "connected") {
                        setTimeout(tryPlayVideo, 500);
                    }
                };

                pc.setRemoteDescription(new RTCSessionDescription({
                    type: "offer",
                    sdp: data.sdp,
                }))
                .then(function () {
                    if (pendingIceCandidates.length > 0) {
                        var promises = pendingIceCandidates.map(function (c) {
                            return pc.addIceCandidate(new RTCIceCandidate({
                                sdpMid: c.sdpMid,
                                sdpMLineIndex: c.sdpMLineIndex,
                                candidate: c.candidate,
                            })).catch(function (e) {
                                console.log("ICE error: " + e.message);
                            });
                        });
                        pendingIceCandidates = [];
                        return Promise.all(promises);
                    }
                })
                .then(function () {
                    return pc.createAnswer();
                })
                .then(function (answer) {
                    return pc.setLocalDescription(answer);
                })
                .then(function () {
                    ws.send(JSON.stringify({
                        type: "answer",
                        sdp: pc.localDescription.sdp,
                    }));
                })
                .catch(function (error) {
                    console.log("Offer handling error: " + error.message);
                });
            }

            function handleIceCandidate(data) {
                if (!data.candidate) return;

                if (!pc || !pc.remoteDescription) {
                    pendingIceCandidates.push(data);
                    return;
                }

                pc.addIceCandidate(new RTCIceCandidate({
                    sdpMid: data.sdpMid,
                    sdpMLineIndex: data.sdpMLineIndex,
                    candidate: data.candidate,
                })).catch(function (e) {
                    console.log("ICE candidate error: " + e.message);
                });
            }

            function cleanup() {
                if (pc) {
                    pc.close();
                    pc = null;
                }
                video.srcObject = null;
            }

            connectWebSocket();

            window.onbeforeunload = function () {
                cleanup();
                if (ws) ws.close();
            };
        </script>
    </body>
</html>
